$schema: "https://json-schema.org/draft/2020-12/schema"
title: "ai_pro_trading_library Case"
type: object
required:
  - case_id
  - display_name
  - category
  - case_type
  - status
properties:
  case_id:
    type: string
    description: "kebab-case unique identifier"
  display_name:
    type: string
  category:
    type: string
    description: "domain category: mean_reversion, trend_following, scanner, social, tradfi, etc."
  case_type:
    type: string
    enum:
      - strategy_backtest
      - scanner_report
      - trade_plan_report
      - research_only
      - runtime_bot
    description: "How the case is consumed by runtime"
  status:
    type: string
    enum:
      - migrated
      - migrated_bootstrap
      - not_executable_yet
      - research_only
      - deprecated
    description: "Migration tier"
  source:
    type: string
    description: "Provenance / source case path"
  notes:
    type: string
  input_requirements:
    type: array
    items:
      type: string
    description: "External inputs (e.g. earnings_calendar.json, macro_events.json)"
  output_schema:
    type: string
    description: "Path to output JSON schema for report cases"
additionalProperties: true
