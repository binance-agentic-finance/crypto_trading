strategy:
  id: st_multi_timeframe_ma_spread
  version: "1.0"
  name: 多周期均线价差(多空)
  description: BTC 1h 主周期 SMA 对高周期 SMA 的价差多空;高周期均线用 secondary_period×secondary_factor 根 1h K 线近似。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:multi_timeframe_ma_spread
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: gate
  type: analysis
  function: factor_evaluate
  name: 研究闸门(factor_evaluate)
  emoji: 🚦
  params:
  - key: factor
    value:
      operator:
        mode: emit
        function_name: mtf_ma_spread
        impl_source: |
          def mtf_ma_spread(*, close, primary_period=20, secondary_period=20, secondary_factor=4):
              c = [float(v) for v in close if v is not None]
              span = max(2, secondary_period * secondary_factor)
              if len(c) < max(primary_period, span):
                  return {'value': None}
              primary = sum(c[-primary_period:]) / primary_period
              secondary = sum(c[-span:]) / span
              return {'value': (primary - secondary) / secondary if secondary else None}
      binding:
        inputs:
          close: close
        params:
          primary_period: 20
          secondary_period: 20
          secondary_factor: 4
        window: 80
        output: value
      name: mtf_ma_spread
  - key: tradeable_verdicts
    value:
    - PASS
    - PASS_CONDITIONAL
    - HOLD_INFO
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 500
    label: K线根数
    widget: number
    min: 100
    max: 1500
  - key: market_type
    value: futures
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_position
  type: data
  function: futures_position_risk
  name: 合约持仓(持仓账本)
  emoji: 💰
  params:
  - key: risk_type
    value: positions
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: primary_period
    value: 20
    label: 主周期均线
    widget: number
    min: 2
    max: 200
    step: 1
  - key: secondary_period
    value: 20
    label: 高周期均线
    widget: number
    min: 2
    max: 200
    step: 1
  - key: threshold_bps
    value: 0.0
    label: 价差阈值(bps)
    widget: number
    min: 0.0
    max: 500.0
    step: 1.0
  - key: secondary_factor
    value: 4
    label: 高周期倍数(根/根)
    widget: number
    min: 1
    max: 24
    step: 1
  - key: target_fraction
    value: 0.2
    label: 目标仓位占权益比例
    widget: number
    min: 0.01
    max: 1.0
    step: 0.01
  - key: stop_pct
    value: 0.03
    label: 止损比例
    widget: number
    min: 0.005
    max: 0.2
    step: 0.005
  code: |
    def _sma(xs: list, n: int, end: int | None = None):
        """Mean of the ``n`` values ending before ``end`` (pandas ``rolling(n).mean()``), or None."""
        end = len(xs) if end is None else end
        if n <= 0 or end < n:
            return None
        return sum(xs[end - n:end]) / n


    def _gt(a, b) -> bool:
        return a is not None and b is not None and a > b


    def _lt(a, b) -> bool:
        return a is not None and b is not None and a < b


    def _event(factors: dict, score, *, long=False, short=False, flat=False) -> dict:
        """Last-bar event → forecast dict; precedence long > short > flat, no event = KEEP."""
        verdict = "LONG" if long else "SHORT" if short else "FLAT" if flat else "KEEP"
        bias = {"LONG": "long", "SHORT": "short"}.get(verdict, "neutral")
        return {"price": factors["close"], "verdict": verdict, "score": score, "bias": bias}


    # ① 因子(只算原始量,不做判断)
    def _factors(bars: dict, p: dict) -> dict:
        c = bars["close"]
        primary = _sma(c, p["primary_period"])
        secondary = _sma(c, max(2, p["secondary_period"] * p["secondary_factor"]))
        spread = (primary - secondary) / secondary if primary is not None and secondary else None
        return {"close": c[-1], "primary_ma": primary, "secondary_ma": secondary, "spread": spread}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        spread, thr = factors["spread"], p["threshold_bps"] / 1e4
        return _event(factors, spread, long=_gt(spread, thr), short=_lt(spread, -thr))


    # ③ 仓位:forecast → 目标仓位 / 止损
    def _sizing(fc: dict, held: float = 0.0, stop_pct: float = 0.03) -> dict:
        """③ forecast → target position + protective stop. No event keeps ``held``."""
        position = {"LONG": 1, "SHORT": -1, "FLAT": 0}.get(fc["verdict"], int(held))
        price = fc["price"]
        stop = (price * (1.0 - stop_pct) if position > 0 else
                price * (1.0 + stop_pct) if position < 0 else None)
        return {"position": position, "stop": stop}


    def _analyze(symbol: str, bars: dict, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,只判断最后一根已收盘 K 线。

        ``held`` 是交易所上的实际持仓:最后一根没有事件就沿用它(无事件 = 保持仓位),
        与回测的逐根持有语义一致。
        """
        factors = _factors(bars, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held, p["stop_pct"])
        return {"symbol": symbol, "verdict": fc["verdict"], "score": fc["score"], "bias": fc["bias"],
                "target_position": size["position"], "stop": size["stop"],
                "missing": list(factors.get("missing", [])),
                "factors": {k: v for k, v in factors.items() if isinstance(v, (int, float))}}
- id: rebalance
  type: execution
  function: futures_open_position
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: venue_class
    value: um
  - key: instrument
    value: BTCUSDT
  - key: size
    value: target_fraction × 权益 × LEVERAGE / close,按 STEP 取整
  - key: side
    value: BUY / SELL(target_position > 0 → BUY 开多,< 0 → SELL 开空)
  - key: position_side
    value: LONG / SHORT
  - key: order_type
    value: MARKET
  - key: target_notional
    value: '{{ state.signal_engine.params.target_fraction }} × 权益(USDT + 持仓市值)'
  - key: stop_order
    value: futures_close_position(close_at_trigger=True, order_type=STOP_MARKET, trigger_price={{ state.signal_engine.output.stop
      }})
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: gate
  to: signal_engine
  label: verdict ∈ PASS / PASS_CONDITIONAL / HOLD_INFO 才交易
- from: fetch_klines
  to: signal_engine
- from: fetch_position
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
