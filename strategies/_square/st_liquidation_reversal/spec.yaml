strategy:
  id: st_liquidation_reversal
  version: "1.0"
  name: 清算潮反转(多空)
  description: BTC 1h 单边清算潮反向:多头爆仓集中时做多,空头爆仓集中时做空;缺清算数据时不交易。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:liquidation_reversal
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 1000
    label: K线根数
    widget: number
    min: 200
    max: 1500
  - key: market_type
    value: futures
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_liquidations
  type: data
  function: liquidation_orders
  name: BTCUSDT 强平订单
  emoji: 💥
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: limit
    value: 1000
    label: 条数
    widget: number
    min: 50
    max: 1000
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: long_liquidation_threshold_usd
    value: 100000.0
    label: 多头爆仓额下限(USD)
    widget: number
    min: 0.0
    max: 100000000.0
    step: 10000.0
  - key: short_liquidation_threshold_usd
    value: 100000.0
    label: 空头爆仓额下限(USD)
    widget: number
    min: 0.0
    max: 100000000.0
    step: 10000.0
  - key: liquidation_imbalance_ratio
    value: 0.6
    label: 单边占比下限
    widget: number
    min: 0.5
    max: 1.0
    step: 0.01
  code: |
    def _hold_forward(entry_long: pd.Series, entry_short: pd.Series, go_flat: pd.Series,
                      index, held: float = 0.0) -> tuple:
        """Kernel TARGET_{LONG,SHORT,FLAT,KEEP} → forward-filled position → (long, short).

        Precedence on a bar: long > short > flat (kernel events are mutually exclusive, so this
        only matters if a caller passes overlapping masks). Bars with no event keep the position;
        bars before the first event hold ``held`` (0 in a backtest, the live holding in a
        windowed live run — otherwise a window with no event would silently flatten it).
        """
        target = pd.Series(np.nan, index=index)
        target[go_flat.fillna(False)] = 0.0
        target[entry_short.fillna(False)] = -1.0
        target[entry_long.fillna(False)] = 1.0
        pos = target.ffill().fillna(held)
        return pos > 0, pos < 0


    def _events(index, score: pd.Series, *, long=None, short=None, flat=None) -> dict:
        """Event masks → forecast dict. ``verdict`` is the bar's target event, with the same
        long > short > flat precedence as :func:`_hold_forward`; ``KEEP`` means no event."""
        none = pd.Series(False, index=index)
        long = none if long is None else long
        short = none if short is None else short
        flat = none if flat is None else flat
        verdict = pd.Series("KEEP", index=index, dtype=object)
        verdict[flat.fillna(False)] = "FLAT"
        verdict[short.fillna(False)] = "SHORT"
        verdict[long.fillna(False)] = "LONG"
        bias = verdict.map({"LONG": "long", "SHORT": "short"}).fillna("neutral")
        return {"index": index, "entry_long": long, "entry_short": short, "go_flat": flat,
                "verdict": verdict, "score": score, "bias": bias}


    def _col(df, name: str) -> pd.Series:
        """A df column if present, else an all-zero series (derivative feeds are optional).

        Zero-filling keeps the backtest contract, but it is a silent no-op: without the feed
        ``oi_funding_breakout`` degenerates into ``donchian_breakout`` and ``liquidation_reversal``
        never trades. The factor stages therefore report absent feeds under ``"missing"``
        (see :func:`_missing`), and the square submission code refuses to trade on them.
        """
        if name in df.columns:
            return df[name]
        return pd.Series(0.0, index=df.index)


    def _missing(df, *names: str) -> list:
        return [name for name in names if name not in df.columns]


    # ① 因子(只算原始量,不做判断)
    def _factors(df, p: dict) -> dict:
        long_liq = _col(df, "long_liq_notional_usd")
        short_liq = _col(df, "short_liq_notional_usd")
        total = long_liq + short_liq
        safe_total = total.replace(0.0, np.nan)
        return {"index": df.index, "long_liq": long_liq, "short_liq": short_liq, "total": total,
                "long_ratio": long_liq / safe_total, "short_ratio": short_liq / safe_total,
                "missing": _missing(df, "long_liq_notional_usd", "short_liq_notional_usd")}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        long_liq, short_liq, total = factors["long_liq"], factors["short_liq"], factors["total"]
        long_ratio, short_ratio = factors["long_ratio"], factors["short_ratio"]
        buy = ((total > 0.0) & (long_liq >= p["long_liquidation_threshold_usd"])
               & (long_ratio >= p["liquidation_imbalance_ratio"]))
        sell = ((total > 0.0) & (short_liq >= p["short_liquidation_threshold_usd"])
                & (short_ratio >= p["liquidation_imbalance_ratio"]))
        return _events(factors["index"], (long_ratio - short_ratio).fillna(0.0),
                       long=buy, short=sell)


    # ③ 仓位:forecast → 持仓 / 止损
    def _sizing(fc: dict, held: float = 0.0) -> dict:
        """③ forecast → position. Built-ins trade a unit position and carry no stop.

        The target is stateful (no event = keep the position), so sizing needs the position
        held before ``fc`` starts: 0 in a backtest, the account/``ctx.state`` holding live.
        """
        long, short = _hold_forward(fc["entry_long"], fc["entry_short"], fc["go_flat"], fc["index"],
                                    held)
        position = long.astype(float) - short.astype(float)
        return {"long": long, "short": short, "position": position, "stop": None}


    def _last(series):
        value = series.iloc[-1] if len(series) else np.nan
        return float(value) if pd.notna(value) else None


    def _analyze(symbol: str, df: pd.DataFrame, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,取最后一根已收盘 K 线的结论。

        ``held`` 是当前实际持仓:窗口内没有任何事件时沿用它(无事件 = 保持仓位),
        这样按窗口算出的目标仓位与回测的逐根持有语义一致。
        """
        factors = _factors(df, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held)
        return {"symbol": symbol, "verdict": fc["verdict"].iloc[-1], "score": _last(fc["score"]),
                "bias": fc["bias"].iloc[-1], "target_position": int(size["position"].iloc[-1]),
                "stop": size["stop"], "missing": list(factors.get("missing", [])),
                "factors": {k: _last(v) for k, v in factors.items() if isinstance(v, pd.Series)}}
- id: rebalance
  type: execution
  function: futures_open_position
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: venue_class
    value: um
  - key: instrument
    value: BTCUSDT
  - key: size
    value: ORDER_NOTIONAL_USDT / close,按 STEP 取整
  - key: side
    value: BUY / SELL(target_position > 0 → BUY 开多,< 0 → SELL 开空)
  - key: order_type
    value: MARKET
  - key: notional_usdt
    value: 100.0
    label: 单笔名义金额(USDT)
    widget: number
    min: 100.0
    max: 10000.0
    step: 10.0
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: fetch_klines
  to: signal_engine
- from: fetch_liquidations
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
