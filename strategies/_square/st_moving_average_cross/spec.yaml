strategy:
  id: st_moving_average_cross
  version: "1.0"
  name: 快慢均线交叉(只做多)
  description: BTC 1h 快慢 SMA 价差:快线高于慢线持多,低于慢线卖出,只做多现货。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:moving_average_cross
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: gate
  type: analysis
  function: factor_evaluate
  name: 研究闸门(factor_evaluate)
  emoji: 🚦
  params:
  - key: factor
    value:
      operator:
        mode: emit
        function_name: ma_spread
        impl_source: |
          def ma_spread(*, close, fast_window=5, slow_window=20):
              c = [float(v) for v in close if v is not None]
              if len(c) < max(fast_window, slow_window):
                  return {'value': None}
              fast = sum(c[-fast_window:]) / fast_window
              slow = sum(c[-slow_window:]) / slow_window
              return {'value': (fast - slow) / slow if slow else None}
      binding:
        inputs:
          close: close
        params:
          fast_window: 5
          slow_window: 20
        window: 20
        output: value
      name: ma_spread
  - key: tradeable_verdicts
    value:
    - PASS
    - PASS_CONDITIONAL
    - HOLD_INFO
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 500
    label: K线根数
    widget: number
    min: 100
    max: 1500
  - key: market_type
    value: spot
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_position
  type: data
  function: account_balances
  name: 现货余额(持仓账本)
  emoji: 💰
  params:
  - key: balance_type
    value: spot
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: fast_window
    value: 5
    label: 快线周期
    widget: number
    min: 2
    max: 100
    step: 1
  - key: slow_window
    value: 20
    label: 慢线周期
    widget: number
    min: 5
    max: 400
    step: 1
  - key: entry_threshold
    value: 0.0
    label: 价差阈值
    widget: number
    min: 0.0
    max: 0.05
    step: 0.0005
  - key: target_fraction
    value: 0.2
    label: 目标仓位占权益比例
    widget: number
    min: 0.01
    max: 1.0
    step: 0.01
  - key: stop_pct
    value: 0.03
    label: 止损比例
    widget: number
    min: 0.005
    max: 0.2
    step: 0.005
  code: |
    def _sma(xs: list, n: int, end: int | None = None):
        """Mean of the ``n`` values ending before ``end`` (pandas ``rolling(n).mean()``), or None."""
        end = len(xs) if end is None else end
        if n <= 0 or end < n:
            return None
        return sum(xs[end - n:end]) / n


    def _gt(a, b) -> bool:
        return a is not None and b is not None and a > b


    def _lt(a, b) -> bool:
        return a is not None and b is not None and a < b


    def _event(factors: dict, score, *, long=False, short=False, flat=False) -> dict:
        """Last-bar event → forecast dict; precedence long > short > flat, no event = KEEP."""
        verdict = "LONG" if long else "SHORT" if short else "FLAT" if flat else "KEEP"
        bias = {"LONG": "long", "SHORT": "short"}.get(verdict, "neutral")
        return {"price": factors["close"], "verdict": verdict, "score": score, "bias": bias}


    # ① 因子(只算原始量,不做判断)
    def _factors(bars: dict, p: dict) -> dict:
        c = bars["close"]
        fast, slow = _sma(c, p["fast_window"]), _sma(c, p["slow_window"])
        spread = (fast - slow) / slow if fast is not None and slow else None
        return {"close": c[-1], "fast_ma": fast, "slow_ma": slow, "spread": spread}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        spread = factors["spread"]
        return _event(factors, spread, long=_gt(spread, p["entry_threshold"]),
                      flat=_lt(spread, -p["entry_threshold"]))          # SELL -> FLAT (long-only)


    # ③ 仓位:forecast → 目标仓位 / 止损
    def _sizing(fc: dict, held: float = 0.0, stop_pct: float = 0.03) -> dict:
        """③ forecast → target position + protective stop. No event keeps ``held``."""
        position = {"LONG": 1, "SHORT": -1, "FLAT": 0}.get(fc["verdict"], int(held))
        price = fc["price"]
        stop = (price * (1.0 - stop_pct) if position > 0 else
                price * (1.0 + stop_pct) if position < 0 else None)
        return {"position": position, "stop": stop}


    def _analyze(symbol: str, bars: dict, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,只判断最后一根已收盘 K 线。

        ``held`` 是交易所上的实际持仓:最后一根没有事件就沿用它(无事件 = 保持仓位),
        与回测的逐根持有语义一致。
        """
        factors = _factors(bars, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held, p["stop_pct"])
        return {"symbol": symbol, "verdict": fc["verdict"], "score": fc["score"], "bias": fc["bias"],
                "target_position": size["position"], "stop": size["stop"],
                "missing": list(factors.get("missing", [])),
                "factors": {k: v for k, v in factors.items() if isinstance(v, (int, float))}}
- id: rebalance
  type: execution
  function: place_order
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: instrument
    value: BTCUSDT
  - key: side
    value: BUY 进场 / SELL 离场(卖出全部基础币)
  - key: quote_size
    value: target_fraction × 权益(BUY)
  - key: size
    value: '{{ state.fetch_position.output.base_qty }}(SELL)'
  - key: order_type
    value: MARKET
  - key: target_notional
    value: '{{ state.signal_engine.params.target_fraction }} × 权益(USDT + 持仓市值)'
  - key: stop_order
    value: place_order(SELL, order_type=STOP_LOSS, stop_price={{ state.signal_engine.output.stop }})
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: gate
  to: signal_engine
  label: verdict ∈ PASS / PASS_CONDITIONAL / HOLD_INFO 才交易
- from: fetch_klines
  to: signal_engine
- from: fetch_position
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
