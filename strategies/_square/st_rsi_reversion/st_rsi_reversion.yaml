strategy:
  id: st_rsi_reversion
  version: "1.0"
  name: RSI 均值回归(只做多)
  description: BTC 1h 简单均值 RSI:低于超卖线开多,高于超买线卖出,只做多现货。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:rsi_reversion
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: gate
  type: analysis
  function: factor_evaluate
  name: 研究闸门(factor_evaluate)
  emoji: 🚦
  params:
  - key: factor
    value:
      operator:
        mode: emit
        function_name: rsi_reversion_score
        impl_source: |
          def rsi_reversion_score(*, close, period=14):
              c = [float(v) for v in close if v is not None]
              if len(c) < period + 1:
                  return {'value': None}
              d = [c[i] - c[i - 1] for i in range(len(c) - period, len(c))]
              gain = sum(x for x in d if x > 0) / period
              loss = sum(-x for x in d if x < 0) / period
              rsi = 100.0 if loss == 0 else 100.0 - 100.0 / (1.0 + gain / loss)
              return {'value': (50.0 - rsi) / 50.0}
      binding:
        inputs:
          close: close
        params:
          period: 14
        window: 15
        output: value
      name: rsi_reversion_score
  - key: tradeable_verdicts
    value:
    - PASS
    - PASS_CONDITIONAL
    - HOLD_INFO
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 500
    label: K线根数
    widget: number
    min: 100
    max: 1500
  - key: market_type
    value: spot
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_position
  type: data
  function: account_balances
  name: 现货余额(持仓账本)
  emoji: 💰
  params:
  - key: balance_type
    value: spot
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: period
    value: 14
    label: RSI 周期
    widget: number
    min: 2
    max: 100
    step: 1
  - key: oversold
    value: 30.0
    label: 超卖线
    widget: number
    min: 5.0
    max: 50.0
    step: 1.0
  - key: overbought
    value: 70.0
    label: 超买线
    widget: number
    min: 50.0
    max: 95.0
    step: 1.0
  - key: target_fraction
    value: 0.2
    label: 目标仓位占权益比例
    widget: number
    min: 0.01
    max: 1.0
    step: 0.01
  - key: stop_pct
    value: 0.03
    label: 止损比例
    widget: number
    min: 0.005
    max: 0.2
    step: 0.005
  code: |
    def _gt(a, b) -> bool:
        return a is not None and b is not None and a > b


    def _lt(a, b) -> bool:
        return a is not None and b is not None and a < b


    def _event(factors: dict, score, *, long=False, short=False, flat=False) -> dict:
        """Last-bar event → forecast dict; precedence long > short > flat, no event = KEEP."""
        verdict = "LONG" if long else "SHORT" if short else "FLAT" if flat else "KEEP"
        bias = {"LONG": "long", "SHORT": "short"}.get(verdict, "neutral")
        return {"price": factors["close"], "verdict": verdict, "score": score, "bias": bias}


    # ① 因子(只算原始量,不做判断)
    def _factors(bars: dict, p: dict) -> dict:
        """RSI with the kernel's **simple** gain/loss mean (not Wilder)."""
        c, period = bars["close"], p["period"]
        rsi = None
        if len(c) >= period + 1:
            d = [c[i] - c[i - 1] for i in range(len(c) - period, len(c))]
            gain = sum(max(x, 0.0) for x in d) / period
            loss = sum(max(-x, 0.0) for x in d) / period
            rsi = 100.0 if loss == 0 else 100.0 - 100.0 / (1.0 + gain / loss)
        return {"close": c[-1], "rsi": rsi}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        rsi = factors["rsi"]
        return _event(factors, None if rsi is None else (50.0 - rsi) / 50.0,
                      long=_lt(rsi, p["oversold"]), flat=_gt(rsi, p["overbought"]))   # SELL -> FLAT


    # ③ 仓位:forecast → 目标仓位 / 止损
    def _sizing(fc: dict, held: float = 0.0, stop_pct: float = 0.03) -> dict:
        """③ forecast → target position + protective stop. No event keeps ``held``."""
        position = {"LONG": 1, "SHORT": -1, "FLAT": 0}.get(fc["verdict"], int(held))
        price = fc["price"]
        stop = (price * (1.0 - stop_pct) if position > 0 else
                price * (1.0 + stop_pct) if position < 0 else None)
        return {"position": position, "stop": stop}


    def _analyze(symbol: str, bars: dict, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,只判断最后一根已收盘 K 线。

        ``held`` 是交易所上的实际持仓:最后一根没有事件就沿用它(无事件 = 保持仓位),
        与回测的逐根持有语义一致。
        """
        factors = _factors(bars, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held, p["stop_pct"])
        return {"symbol": symbol, "verdict": fc["verdict"], "score": fc["score"], "bias": fc["bias"],
                "target_position": size["position"], "stop": size["stop"],
                "missing": list(factors.get("missing", [])),
                "factors": {k: v for k, v in factors.items() if isinstance(v, (int, float))}}
- id: rebalance
  type: execution
  function: place_order
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: instrument
    value: BTCUSDT
  - key: side
    value: BUY 进场 / SELL 离场(卖出全部基础币)
  - key: quote_size
    value: target_fraction × 权益(BUY)
  - key: size
    value: '{{ state.fetch_position.output.base_qty }}(SELL)'
  - key: order_type
    value: MARKET
  - key: target_notional
    value: '{{ state.signal_engine.params.target_fraction }} × 权益(USDT + 持仓市值)'
  - key: stop_order
    value: place_order(SELL, order_type=STOP_LOSS, stop_price={{ state.signal_engine.output.stop }})
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: gate
  to: signal_engine
  label: verdict ∈ PASS / PASS_CONDITIONAL / HOLD_INFO 才交易
- from: fetch_klines
  to: signal_engine
- from: fetch_position
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
