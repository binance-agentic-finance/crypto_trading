strategy:
  id: st_oi_funding_breakout
  version: "1.0"
  name: 持仓量确认突破(多空)
  description: BTC 1h 唐奇安突破需持仓量同步上升、资金费率不过热才入场,多空对称;缺持仓量/资金费率数据时不交易。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:oi_funding_breakout
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: gate
  type: custom
  name: 研究闸门(固定 HOLD_INFO)
  emoji: 🚦
  params:
  - key: verdict
    value: HOLD_INFO
  code: |
    return {'verdict': 'HOLD_INFO', 'tradeable': True}
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 500
    label: K线根数
    widget: number
    min: 100
    max: 1500
  - key: market_type
    value: futures
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_position
  type: data
  function: futures_position_risk
  name: 合约持仓(持仓账本)
  emoji: 💰
  params:
  - key: risk_type
    value: positions
- id: fetch_open_interest
  type: data
  function: derivatives_market_metrics
  name: BTCUSDT 持仓量历史
  emoji: 📦
  params:
  - key: metric_type
    value: open_interest_history
    label: 指标类型
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: period
    value: 1h
    label: 统计周期
    widget: text
  - key: limit
    value: 50
    label: 条数
    widget: number
    min: 2
    max: 500
- id: fetch_funding_rate
  type: data
  function: derivatives_market_metrics
  name: BTCUSDT 资金费率
  emoji: 💸
  params:
  - key: metric_type
    value: funding_rate_info
    label: 指标类型
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: lookback_window
    value: 20
    label: 通道回看根数
    widget: number
    min: 5
    max: 200
    step: 1
  - key: breakout_buffer_bps
    value: 0.0
    label: 突破缓冲(bps)
    widget: number
    min: 0.0
    max: 200.0
    step: 1.0
  - key: oi_threshold_bps
    value: 0.0
    label: 持仓量变化下限(bps)
    widget: number
    min: -500.0
    max: 500.0
    step: 1.0
  - key: max_funding_rate_bps
    value: 100.0
    label: 资金费率上限(bps)
    widget: number
    min: 0.0
    max: 500.0
    step: 1.0
  - key: target_fraction
    value: 0.2
    label: 目标仓位占权益比例
    widget: number
    min: 0.01
    max: 1.0
    step: 0.01
  - key: stop_pct
    value: 0.03
    label: 止损比例
    widget: number
    min: 0.005
    max: 0.2
    step: 0.005
  code: |
    def _channel(high: list, low: list, n: int):
        """唐奇安通道:不含当前 K 线的前 n 根最高 / 最低价(平台 rolling_extreme)。"""
        if len(high) < n + 1 or len(low) < n + 1:
            return None, None
        upper = rolling_extreme(series=high[:-1], op="max", period=n)["value"]
        lower = rolling_extreme(series=low[:-1], op="min", period=n)["value"]
        return upper, lower


    def _channel_position(close, upper, lower):
        if upper is None or lower is None or upper == lower:
            return None
        return 2.0 * (close - (upper + lower) / 2.0) / (upper - lower)


    def _event(factors: dict, score, *, long=False, short=False, flat=False) -> dict:
        """Last-bar event → forecast dict; precedence long > short > flat, no event = KEEP."""
        verdict = "LONG" if long else "SHORT" if short else "FLAT" if flat else "KEEP"
        bias = {"LONG": "long", "SHORT": "short"}.get(verdict, "neutral")
        return {"price": factors["close"], "verdict": verdict, "score": score, "bias": bias}


    # ① 因子(只算原始量,不做判断)
    def _factors(bars: dict, p: dict) -> dict:
        upper, lower = _channel(bars["high"], bars["low"], p["lookback_window"])
        oi, funding = bars.get("oi_change_bps"), bars.get("funding_rate_bps")
        return {"close": bars["close"][-1], "upper": upper, "lower": lower,
                "oi_change_bps": oi, "funding_rate_bps": funding,
                "missing": [k for k, v in (("oi_change_bps", oi), ("funding_rate_bps", funding))
                            if v is None]}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        close, upper, lower = factors["close"], factors["upper"], factors["lower"]
        oi, funding = factors["oi_change_bps"], factors["funding_rate_bps"]
        buf = p["breakout_buffer_bps"] / 1e4
        oi_ok = oi is not None and oi >= p["oi_threshold_bps"]
        buy = (oi_ok and upper is not None and close > upper * (1.0 + buf)
               and funding is not None and funding <= p["max_funding_rate_bps"])
        sell = (oi_ok and lower is not None and close < lower * (1.0 - buf)
                and funding is not None and funding >= -p["max_funding_rate_bps"])
        return _event(factors, _channel_position(close, upper, lower), long=buy, short=sell)


    # ③ 仓位:forecast → 目标仓位 / 止损
    def _sizing(fc: dict, held: float = 0.0, stop_pct: float = 0.03) -> dict:
        """③ forecast → target position + protective stop. No event keeps ``held``."""
        position = {"LONG": 1, "SHORT": -1, "FLAT": 0}.get(fc["verdict"], int(held))
        price = fc["price"]
        stop = (price * (1.0 - stop_pct) if position > 0 else
                price * (1.0 + stop_pct) if position < 0 else None)
        return {"position": position, "stop": stop}


    def _analyze(symbol: str, bars: dict, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,只判断最后一根已收盘 K 线。

        ``held`` 是交易所上的实际持仓:最后一根没有事件就沿用它(无事件 = 保持仓位),
        与回测的逐根持有语义一致。
        """
        factors = _factors(bars, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held, p["stop_pct"])
        return {"symbol": symbol, "verdict": fc["verdict"], "score": fc["score"], "bias": fc["bias"],
                "target_position": size["position"], "stop": size["stop"],
                "missing": list(factors.get("missing", [])),
                "factors": {k: v for k, v in factors.items() if isinstance(v, (int, float))}}
- id: rebalance
  type: execution
  function: futures_open_position
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: venue_class
    value: um
  - key: instrument
    value: BTCUSDT
  - key: size
    value: target_fraction × 权益 × LEVERAGE / close,按 STEP 取整
  - key: side
    value: BUY / SELL(target_position > 0 → BUY 开多,< 0 → SELL 开空)
  - key: position_side
    value: LONG / SHORT
  - key: order_type
    value: MARKET
  - key: target_notional
    value: '{{ state.signal_engine.params.target_fraction }} × 权益(USDT + 持仓市值)'
  - key: stop_order
    value: futures_close_position(close_at_trigger=True, order_type=STOP_MARKET, trigger_price={{ state.signal_engine.output.stop
      }})
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: gate
  to: signal_engine
  label: verdict ∈ PASS / PASS_CONDITIONAL / HOLD_INFO 才交易
- from: fetch_klines
  to: signal_engine
- from: fetch_position
  to: signal_engine
- from: fetch_open_interest
  to: signal_engine
- from: fetch_funding_rate
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
