strategy:
  id: st_donchian_breakout
  version: "1.0"
  name: 唐奇安通道突破(多空)
  description: BTC 1h 唐奇安通道(不含当根)向上突破做多、向下突破做空,多空翻转。
  source: cyqnt_trd.standard_bot.signal.framework_strategies:donchian_breakout
trigger:
  type: schedule
  config:
    interval: 1h
nodes:
- id: fetch_klines
  type: data
  function: klines
  name: BTCUSDT 1h K线
  emoji: 🕯️
  params:
  - key: symbol
    value: BTCUSDT
    label: 交易对
    widget: text
  - key: timeframe
    value: 1h
    label: K线周期
    widget: text
  - key: limit
    value: 1000
    label: K线根数
    widget: number
    min: 200
    max: 1500
  - key: market_type
    value: futures
    label: 市场
  - key: closed_only
    value: true
    label: 只用已收盘K线
- id: fetch_position
  type: data
  function: futures_position_risk
  name: 合约持仓(持仓账本)
  emoji: 💰
  params:
  - key: risk_type
    value: positions
- id: signal_engine
  type: custom
  name: 三段式信号:因子 → forecast → 仓位
  emoji: 🧠
  params:
  - key: lookback_window
    value: 20
    label: 通道回看根数
    widget: number
    min: 5
    max: 200
    step: 1
  - key: breakout_buffer_bps
    value: 0.0
    label: 突破缓冲(bps)
    widget: number
    min: 0.0
    max: 200.0
    step: 1.0
  - key: target_fraction
    value: 0.2
    label: 目标仓位占权益比例
    widget: number
    min: 0.01
    max: 1.0
    step: 0.01
  code: |
    def _hold_forward(entry_long: pd.Series, entry_short: pd.Series, go_flat: pd.Series,
                      index, held: float = 0.0) -> tuple:
        """Kernel TARGET_{LONG,SHORT,FLAT,KEEP} → forward-filled position → (long, short).

        Precedence on a bar: long > short > flat (kernel events are mutually exclusive, so this
        only matters if a caller passes overlapping masks). Bars with no event keep the position;
        bars before the first event hold ``held`` (0 in a backtest, the live holding in a
        windowed live run — otherwise a window with no event would silently flatten it).
        """
        target = pd.Series(np.nan, index=index)
        target[go_flat.fillna(False)] = 0.0
        target[entry_short.fillna(False)] = -1.0
        target[entry_long.fillna(False)] = 1.0
        pos = target.ffill().fillna(held)
        return pos > 0, pos < 0


    def _events(index, score: pd.Series, *, long=None, short=None, flat=None) -> dict:
        """Event masks → forecast dict. ``verdict`` is the bar's target event, with the same
        long > short > flat precedence as :func:`_hold_forward`; ``KEEP`` means no event."""
        none = pd.Series(False, index=index)
        long = none if long is None else long
        short = none if short is None else short
        flat = none if flat is None else flat
        verdict = pd.Series("KEEP", index=index, dtype=object)
        verdict[flat.fillna(False)] = "FLAT"
        verdict[short.fillna(False)] = "SHORT"
        verdict[long.fillna(False)] = "LONG"
        bias = verdict.map({"LONG": "long", "SHORT": "short"}).fillna("neutral")
        return {"index": index, "entry_long": long, "entry_short": short, "go_flat": flat,
                "verdict": verdict, "score": score, "bias": bias}


    def _channel_position(close: pd.Series, upper: pd.Series, lower: pd.Series) -> pd.Series:
        """Where close sits in the channel: -1 at the lower band, +1 at the upper (unbounded)."""
        width = (upper - lower).replace(0.0, np.nan)
        return 2.0 * (close - (upper + lower) / 2.0) / width


    # ① 因子(只算原始量,不做判断)
    def _factors(df, p: dict) -> dict:
        upper = df["high"].shift(1).rolling(p["lookback_window"]).max()
        lower = df["low"].shift(1).rolling(p["lookback_window"]).min()
        return {"index": df.index, "close": df["close"], "upper": upper, "lower": lower}


    # ② forecast:因子 → verdict / score / bias
    def _forecast(factors: dict, p: dict) -> dict:
        close, upper, lower = factors["close"], factors["upper"], factors["lower"]
        buy = close > upper * (1.0 + p["breakout_buffer_bps"] / 1e4)
        sell = close < lower * (1.0 - p["breakout_buffer_bps"] / 1e4)   # SELL -> SHORT
        return _events(factors["index"], _channel_position(close, upper, lower),
                       long=buy, short=sell)


    # ③ 仓位:forecast → 持仓 / 止损
    def _sizing(fc: dict, held: float = 0.0) -> dict:
        """③ forecast → position. Built-ins trade a unit position and carry no stop.

        The target is stateful (no event = keep the position), so sizing needs the position
        held before ``fc`` starts: 0 in a backtest, the account/``ctx.state`` holding live.
        """
        long, short = _hold_forward(fc["entry_long"], fc["entry_short"], fc["go_flat"], fc["index"],
                                    held)
        position = long.astype(float) - short.astype(float)
        return {"long": long, "short": short, "position": position, "stop": None}


    def _last(series):
        value = series.iloc[-1] if len(series) else np.nan
        return float(value) if pd.notna(value) else None


    def _analyze(symbol: str, df: pd.DataFrame, p: dict = PARAMS, held: float = 0.0) -> dict:
        """单标的三段式分析:factors → forecast → sizing,取最后一根已收盘 K 线的结论。

        ``held`` 是当前实际持仓:窗口内没有任何事件时沿用它(无事件 = 保持仓位),
        这样按窗口算出的目标仓位与回测的逐根持有语义一致。
        """
        factors = _factors(df, p)
        fc = _forecast(factors, p)
        size = _sizing(fc, held)
        return {"symbol": symbol, "verdict": fc["verdict"].iloc[-1], "score": _last(fc["score"]),
                "bias": fc["bias"].iloc[-1], "target_position": int(size["position"].iloc[-1]),
                "stop": size["stop"], "missing": list(factors.get("missing", [])),
                "factors": {k: _last(v) for k, v in factors.items() if isinstance(v, pd.Series)}}
- id: rebalance
  type: execution
  function: futures_open_position
  name: 调仓到目标仓位
  emoji: ⚖️
  condition: '{{ state.signal_engine.output.rebalance_needed }}'
  params:
  - key: venue_class
    value: um
  - key: instrument
    value: BTCUSDT
  - key: size
    value: target_fraction × 权益 × LEVERAGE / close,按 STEP 取整
  - key: side
    value: BUY / SELL(target_position > 0 → BUY 开多,< 0 → SELL 开空)
  - key: position_side
    value: LONG / SHORT
  - key: order_type
    value: MARKET
  - key: target_notional
    value: '{{ state.signal_engine.params.target_fraction }} × 权益(USDT + 持仓市值)'
- id: notify_signal
  type: execution
  function: notify
  name: 推送调仓通知
  emoji: 🔔
  condition: '{{ state.rebalance.output.changed }}'
  params:
  - key: message
    value: '{{ state.signal_engine.output.symbol }} {{ state.signal_engine.output.verdict }} {{ state.rebalance.output.from
      }} -> {{ state.rebalance.output.to }}'
    label: 通知内容
    widget: text
  - key: channel
    value: app
edges:
- from: fetch_klines
  to: signal_engine
- from: fetch_position
  to: signal_engine
- from: signal_engine
  to: rebalance
  label: 目标仓位变化
- from: rebalance
  to: notify_signal
  label: 已调仓
